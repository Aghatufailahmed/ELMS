<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EduFlow — Sign In</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>
<div class="bg-blob blob-3"></div>

<div class="login-wrap">
  <div class="login-card glass">

    <div class="login-brand">
      <span class="brand-mark">E</span>
      <span class="brand-name">EduFlow</span>
    </div>

    <h2 class="login-title">Welcome back</h2>
    <p class="login-sub">Sign in to your account to continue</p>

    <div class="login-error" id="loginError"></div>

    <form id="loginForm" autocomplete="off">
      <div class="login-field">
        <label for="email">Email address</label>
        <input
          class="glass-input full-w"
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="login-field">
        <label for="password">Password</label>
        <input
          class="glass-input full-w"
          type="password"
          id="password"
          name="password"
          placeholder="Your password"
          autocomplete="current-password"
          required
        />
        <button type="button" class="pw-toggle" id="pwToggle">Show</button>
      </div>

      <button type="submit" class="btn-primary login-btn" id="loginBtn">Sign In</button>
    </form>

    <div class="login-demo" id="setupNotice" hidden>
      No administrator is configured. Create the first admin using the setup instructions in README.md.
    </div>
  </div>
</div>

<script>
  async function checkApplicationState() {
    try {
      const setupResponse = await fetch('/api/auth/setup-status');
      if (!setupResponse.ok) throw new Error('Unable to check application setup');
      const setup = await setupResponse.json();
      document.getElementById('setupNotice').hidden = !setup.needsAdminSetup;
      if (setup.needsAdminSetup) document.getElementById('loginForm').hidden = true;

      const token = localStorage.getItem('eduflow_token');
      if (!token) return;
      const response = await fetch('/api/auth/me', {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (response.ok) {
        const { user } = await response.json();
        localStorage.setItem('eduflow_user', JSON.stringify(user));
        window.location.href = '/dashboard';
        return;
      }
      localStorage.removeItem('eduflow_token');
      localStorage.removeItem('eduflow_user');
    } catch (error) {
      const errEl = document.getElementById('loginError');
      errEl.textContent = error.message;
      errEl.classList.add('visible');
    }
  }
  checkApplicationState();

  // Show/hide password
  const pwInput  = document.getElementById('password');
  const pwToggle = document.getElementById('pwToggle');
  pwToggle.addEventListener('click', () => {
    const isHidden = pwInput.type === 'password';
    pwInput.type   = isHidden ? 'text' : 'password';
    pwToggle.textContent = isHidden ? 'Hide' : 'Show';
  });

  // Login form
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl  = document.getElementById('loginError');
    const btn    = document.getElementById('loginBtn');
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    errEl.classList.remove('visible');
    btn.textContent = 'Signing in…';
    btn.disabled    = true;

    try {
      const res  = await fetch('/api/auth/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Login failed');

      localStorage.setItem('eduflow_token', data.token);
      localStorage.setItem('eduflow_user',  JSON.stringify(data.user));
      window.location.href = '/dashboard';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.add('visible');
      btn.textContent = 'Sign In';
      btn.disabled    = false;
    }
  });
</script>
</body>
</html>
